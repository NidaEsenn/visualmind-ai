services:

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"        # exposed for debugging; nginx is the public entrypoint
    volumes:
      - image_data:/app/data   # uploaded images + thumbnails
      - clip_cache:/root/.cache  # CLIP model weights (~350 MB, cached across restarts)
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: visualmind_images
      IMAGE_STORAGE_PATH: /app/data/images
      CLIP_MODEL_NAME: ViT-B-32
      CORS_ORIGINS: "http://localhost,http://localhost:80"
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"            # open http://localhost in browser
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_storage:
  image_data:
  clip_cache:
